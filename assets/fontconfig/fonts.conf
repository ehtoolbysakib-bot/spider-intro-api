<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/app/applet/assets/fonts</dir>
  <dir>/root/.fonts</dir>
  <dir>/root/.local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <config>
    <rescan>
      <int>30</int>
    </rescan>
  </config>
</fontconfig>